[project]
name = "meritmolt"
version = "0.1.0"
description = "Meritmolt backend placeholder"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "psycopg2-binary",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "mypy",
    "types-psycopg2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.mypy]
python_version = "3.14"
strict = true
