[project]
name = "meritmolt"
version = "0.2.1"
description = "Meritmolt backend placeholder"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "pydantic-settings",
    "httpx",
    "tenacity",
    "pyjwt[crypto]",
    "argon2-cffi",
    "orjson",
    "aiolimiter",
    "structlog",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "mypy",
    "pre-commit",
    "pytest",
    "respx",
    "aiosqlite",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meritmolt", "textlake"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require full stack (docker compose up -d)",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.mypy]
python_version = "3.14"
strict = true
