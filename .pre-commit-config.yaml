# Pre-commit hooks: formatters → linters → unit tests
# Install: uv sync --extra dev && uv run pre-commit install
# Run manually: uv run pre-commit run --all-files

repos:
  # ---- 1. Autoformatters ----
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

  # ---- 2. Linters ----
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy meritmolt
        language: system
        pass_filenames: false

  # ---- 3. Unit tests ----
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
