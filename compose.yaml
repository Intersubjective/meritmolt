name: meritmolt

services:
  common:
    init: true
    image: scratch
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    environment:
      - POSTGRES_PASSWORD
      - MM_MOLTBOOK_APP_KEY
      - MM_MOLTBOOK_API_BASE
      - MM_JWT_PRIVATE_KEYS
      - MM_JWT_PUBLIC_KEYS
      - MM_ACCESS_TTL_SECONDS
      - MM_REFRESH_TTL_SECONDS
      - MM_REFRESH_MAX_ACTIVE_PER_AGENT
      - MM_HTTP_TIMEOUT_SECONDS
      - MM_HTTP_RETRY_MAX_ATTEMPTS
      - MM_MERITRANK_INIT_ON_STARTUP

  caddy:
    extends:
      service: common
    hostname: caddy
    container_name: caddy
    image: caddy:2
    depends_on:
      - meritmolt
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CADDY_DOMAIN
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  postgres:
    extends:
      service: common
    hostname: postgres
    container_name: postgres
    # Image provides MeritMolt schema (pgmer2 extension); image name is legacy.
    image: vbulavintsev/postgres-tentura:v0.3.26
    depends_on:
      - meritrank
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      - 'MERITRANK_SERVICE_URL=tcp://meritrank:10234'
      - POSTGRES_DB=textlake

  meritrank:
    extends:
      service: common
    hostname: meritrank
    container_name: meritrank
    image: vbulavintsev/meritrank-service:v0.2.59
    read_only: true
    environment:
      - 'MERITRANK_NUM_WALKS=100'
      - 'MERITRANK_ZERO_OPINION_FACTOR=2'
      - 'MERITRANK_SERVICE_URL=tcp://0.0.0.0:10234'
      - "VSIDS_BUMP=1.0"
      - "RUST_BACKTRACE=full"
      - "MERITRANK_OMIT_NEG_EDGES_SCORES=true"

  meritmolt:
    extends:
      service: common
    hostname: meritmolt
    container_name: meritmolt
    image: ghcr.io/intersubjective/meritmolt:${MM_IMAGE_TAG:-latest}
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD
      - POSTGRES_DB=textlake
      - MM_MOLTBOOK_APP_KEY
      - MM_MOLTBOOK_API_BASE
      - MM_JWT_PRIVATE_KEYS
      - MM_JWT_PUBLIC_KEYS
      - MM_ACCESS_TTL_SECONDS
      - MM_REFRESH_TTL_SECONDS
      - MM_REFRESH_MAX_ACTIVE_PER_AGENT
      - MM_HTTP_TIMEOUT_SECONDS
      - MM_HTTP_RETRY_MAX_ATTEMPTS
      - MM_RL_AUTH_LOGIN_LIMIT
      - MM_RL_AUTH_REFRESH_LIMIT
      - MM_RL_WRITES_BURST
      - MM_RL_WRITES_SUSTAIN
      - MM_RL_READS_BURST
      - MM_RL_READS_SUSTAIN
      - MM_RL_BUCKET_MAX_KEYS
      - MM_RL_BUCKET_TTL_SECONDS
      - MM_BP_GLOBAL_MAX_CONCURRENT
      - MM_BP_READS_MAX_CONCURRENT
      - MM_BP_WRITES_MAX_CONCURRENT
      - MM_BP_AUTH_MAX_CONCURRENT
      - MM_BP_REQUEST_DEADLINE_SECONDS

  textlake:
    extends:
      service: common
    hostname: textlake
    container_name: textlake
    build: .
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    depends_on:
      - postgres
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD
      - POSTGRES_DB=textlake
      - MB_CRAWLER_API_KEY
      - MB_API_BASE=https://www.moltbook.com/api/v1
      - MB_RATE_LIMIT_RPM=100
      - MB_CONCURRENCY=10
    command: ["python", "-m", "textlake"]

volumes:
  pg_data:
  caddy_data:
