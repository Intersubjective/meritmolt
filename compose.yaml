name: meritmolt

x-common: &common
  init: true
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: "1"

services:
  caddy:
    <<: *common
    hostname: caddy
    container_name: caddy
    image: caddy:2
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      meritmolt:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CADDY_DOMAIN
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  postgres:
    <<: *common
    hostname: postgres
    container_name: postgres
    # Image provides MeritMolt schema (pgmer2 extension); image name is legacy.
    image: vbulavintsev/postgres-tentura:v0.8.0
    depends_on:
      meritrank:
        condition: service_started
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD
      - POSTGRES_DB=textlake
      - 'MERITRANK_SERVICE_URL=tcp://meritrank:8080'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  meritrank:
    <<: *common
    hostname: meritrank
    container_name: meritrank
    image: vbulavintsev/meritrank-service:v0.8.0
    read_only: true
    cap_drop:
      - ALL
    environment:
      - "MERITRANK_SERVER_ADDRESS=0.0.0.0"
      - "MERITRANK_SERVER_PORT=8080"
      - "MERITRANK_NUM_WALKS=${MERITRANK_NUM_WALKS:-100}"
      - "MERITRANK_ZERO_OPINION_FACTOR=0.02"
      - "MERITRANK_WALKS_CACHE_SIZE=100"
      - "VSIDS_BUMP=1.0"
      - "RUST_BACKTRACE=full"
      - "MERITRANK_OMIT_NEG_EDGES_SCORES=true"

  meritmolt:
    <<: *common
    hostname: meritmolt
    container_name: meritmolt
    image: ghcr.io/intersubjective/meritmolt:${MM_IMAGE_TAG:-latest}
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD
      - POSTGRES_DB=textlake
      - MM_MOLTBOOK_APP_KEY
      - MM_MOLTBOOK_API_BASE
      - MM_JWT_PRIVATE_KEYS
      - MM_JWT_PUBLIC_KEYS
      - MM_ACCESS_TTL_SECONDS
      - MM_REFRESH_TTL_SECONDS
      - MM_REFRESH_MAX_ACTIVE_PER_AGENT
      - MM_HTTP_TIMEOUT_SECONDS
      - MM_HTTP_RETRY_MAX_ATTEMPTS
      - MM_MERITRANK_INIT_ON_STARTUP
      - MM_RL_AUTH_LOGIN_LIMIT
      - MM_RL_AUTH_REFRESH_LIMIT
      - MM_RL_WRITES_BURST
      - MM_RL_WRITES_SUSTAIN
      - MM_RL_READS_BURST
      - MM_RL_READS_SUSTAIN
      - MM_RL_BUCKET_MAX_KEYS
      - MM_RL_BUCKET_TTL_SECONDS
      - MM_BP_GLOBAL_MAX_CONCURRENT
      - MM_BP_READS_MAX_CONCURRENT
      - MM_BP_WRITES_MAX_CONCURRENT
      - MM_BP_AUTH_MAX_CONCURRENT
      - MM_BP_REQUEST_DEADLINE_SECONDS
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  textlake:
    <<: *common
    hostname: textlake
    container_name: textlake
    build: .
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD
      - POSTGRES_DB=textlake
      - MB_CRAWLER_API_KEY
      - MB_API_BASE=https://www.moltbook.com/api/v1
      - MB_RATE_LIMIT_RPM=100
      - MB_CONCURRENCY=10
    command: ["python", "-m", "textlake"]

volumes:
  pg_data:
  caddy_data:
